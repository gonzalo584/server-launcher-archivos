name: Compilar mod Server Menu

on:
  push:
  workflow_dispatch: {}

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sacar el codigo del zip
        run: |
          if [ ! -d mod-servermenu ]; then unzip -q -o subir-a-github.zip; fi
          ls mod-servermenu/src

      - name: Bajar el MDK de Forge 1.20.1
        run: |
          curl -sSL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          unzip -q mdk.zip -d mdk
          D=$(dirname "$(find mdk -maxdepth 2 -name gradlew | head -1)")
          echo "MDK=$D" >> $GITHUB_ENV
          rm -rf "$D/src" && cp -r mod-servermenu/src "$D/src"
          sed -i 's/^mod_id=.*/mod_id=servermenu/; s/^mod_name=.*/mod_name=Server Menu/; s/^mod_group_id=.*/mod_group_id=com.server.servermenu/; s/^mod_version=.*/mod_version=1.0.0/' "$D/gradle.properties"

      - name: Compilar
        run: |
          cd "$MDK"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: servermenu-jar
          path: ${{ env.MDK }}/build/libs/*.jar
